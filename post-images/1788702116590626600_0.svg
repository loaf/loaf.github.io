<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="release-flow-title release-flow-desc">
      <title id="release-flow-title">新模型版本上线流程</title>
      <desc id="release-flow-desc">流程图：新版本依次通过离线基准评估、小流量灰度监控、逐步放量监控三道判定关卡，全部通过后全量上线；任一关卡不通过则进入“返回重训练”节点，并作为反馈回路回到流程入口。</desc>

      <defs>
        <style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#7a8399"/>
        </marker>
      </defs>

      <!-- Background: clean paper -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ARROWS (drawn first, behind nodes) ============ -->

      <!-- Spine: A -> B -->
      <line x1="420" y1="88" x2="420" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B -> C  (通过) -->
      <line x1="420" y1="216" x2="420" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- C -> E -->
      <line x1="420" y1="296" x2="420" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E -> F  (通过) -->
      <line x1="420" y1="424" x2="420" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- F -> EE -->
      <line x1="420" y1="504" x2="420" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- EE -> Z  (通过, coral focal) -->
      <line x1="420" y1="632" x2="420" y2="664" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- B -> R  (不通过) : left vertex (320,168) -> rail x=268 -> R right edge (240,362) -->
      <path d="M 320 168 L 276 168 Q 268 168 268 176 L 268 354 Q 268 362 260 362 L 240 362"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E -> R  (不通过) : straight, left vertex (320,376) -> R right edge (240,376) -->
      <line x1="320" y1="376" x2="240" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- EE -> R (不通过) : left vertex (320,584) -> rail x=252 -> R right edge (240,390) -->
      <path d="M 320 584 L 260 584 Q 252 584 252 576 L 252 398 Q 252 390 260 390 L 240 390"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- R -> A  (loop back, dashed = return / feedback) : R left (80,392) -> rail x=40 -> A left edge (340,64) -->
      <path d="M 80 392 L 48 392 Q 40 392 40 384 L 40 72 Q 40 64 48 64 L 340 64"
            fill="none" stroke="#7a8399" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>

      <!-- ============ ARROW LABELS (mask + text, 6-10px gap above connector) ============ -->

      <!-- 通过: B->C (vertical, label to right) -->
      <rect x="428" y="224" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="442" y="234" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">通过</text>

      <!-- 通过: E->F -->
      <rect x="428" y="432" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="442" y="442" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">通过</text>

      <!-- 通过: EE->Z (coral) -->
      <rect x="428" y="640" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="442" y="650" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">通过</text>

      <!-- 不通过: B->R (horizontal y=168, mid 294) -->
      <rect x="280" y="150" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="294" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">不通过</text>

      <!-- 不通过: E->R (horizontal y=376, mid 280) -->
      <rect x="266" y="358" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">不通过</text>

      <!-- 不通过: EE->R (horizontal y=584, mid 286) -->
      <rect x="272" y="566" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="286" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">不通过</text>

      <!-- loop hint: R->A (near top horizontal y=64) -->
      <rect x="150" y="48" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="188" y="58" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">重训 · 重新评估</text>

      <!-- ============ NODES ============ -->

      <!-- A: 新版本 (start, stadium) -->
      <rect x="340" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="420" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" dominant-baseline="middle">新版本</text>
      <text x="420" y="78" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">new model build</text>

      <!-- B: 离线基准达标? (decision diamond) -->
      <polygon points="420,120 520,168 420,216 320,168" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">离线基准</text>
      <text x="420" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">达标?</text>

      <!-- C: 小流量灰度 <5% (step) -->
      <rect x="330" y="248" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">小流量灰度</text>
      <text x="420" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">流量 &lt; 5%</text>

      <!-- E: 线上指标监控? (decision diamond, 灰度后) -->
      <polygon points="420,328 520,376 420,424 320,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">线上指标</text>
      <text x="420" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">监控?</text>

      <!-- F: 逐步放量 20%->50%->100% (step) -->
      <rect x="310" y="456" width="220" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="478" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">逐步放量</text>
      <text x="420" y="494" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">20% → 50% → 100%</text>

      <!-- EE: 线上指标监控? (decision diamond, 放量后) -->
      <polygon points="420,536 520,584 420,632 320,584" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="580" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">线上指标</text>
      <text x="420" y="596" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">监控?</text>

      <!-- Z: 全量上线 (end, stadium, FOCAL coral) -->
      <rect x="340" y="664" width="160" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="420" y="690" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">全量上线</text>
      <text x="420" y="706" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">100% release</text>

      <!-- R: 返回重训练 (shared rollback hub, step) -->
      <rect x="80" y="348" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">返回重训练</text>
      <text x="160" y="388" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rollback · retrain</text>

      <!-- ============ LEGEND (horizontal bottom strip) ============ -->
      <line x1="40" y1="752" x2="560" y2="752" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="772" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · 形状即类型</text>

      <!-- stadium swatch -->
      <rect x="40" y="788" width="28" height="14" rx="7" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="76" y="799" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">开始 / 结束</text>

      <!-- rect swatch -->
      <rect x="176" y="788" width="28" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="212" y="799" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">步骤</text>

      <!-- diamond swatch -->
      <polygon points="288,795 302,788 316,795 302,802" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="324" y="799" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">判定</text>

      <!-- coral focal arrow -->
      <line x1="392" y1="795" x2="424" y2="795" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="432" y="799" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">达成目标</text>

      <!-- dashed return arrow -->
      <line x1="500" y1="795" x2="532" y2="795" stroke="#7a8399" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <text x="540" y="799" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">反馈回路</text>
    </svg>