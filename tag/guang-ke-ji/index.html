<script>
(function () {
  'use strict';
  if (window.__grideaImageViewer) return;
  window.__grideaImageViewer = true;

  var SVG_RE = /\.(svg|ico)([?#]|$)/i;

  // 链接内图片（保持跳转）、显式 data-no-viewer、svg/ico 图标、加载后仍 ≤50px 的小图标不启用
  function skip(img) {
    if (img.closest('a')) return true;
    if (img.closest('[data-no-viewer]')) return true;
    var src = img.currentSrc || img.src || '';
    if (SVG_RE.test(src)) return true;
    if (img.complete && img.naturalWidth > 0 && img.naturalWidth <= 50 && img.naturalHeight <= 50) return true;
    return false;
  }

  // 给可查看的图片加放大镜光标提示（点击走事件委托，后续动态插入的图片同样生效）
  function markTargets() {
    var imgs = document.images;
    for (var i = 0; i < imgs.length; i++) {
      if (!skip(imgs[i])) imgs[i].classList.add('gridea-viewer-target');
    }
  }
  markTargets();
  window.addEventListener('load', markTargets);

  document.addEventListener('click', function (e) {
    var img = e.target;
    if (!(img instanceof HTMLImageElement)) return;
    if (img.classList.contains('gridea-viewer-img')) return; // 查看器内的图片自身
    if (skip(img)) return;
    e.preventDefault();
    e.stopPropagation();
    open(img.currentSrc || img.src);
  }, false);

  var overlay = null, view = null, pct = null, btnFit = null;
  var s = 1, tx = 0, ty = 0, fitS = 1, prevOverflow = '';

  function vw() { return overlay ? overlay.clientWidth : window.innerWidth; }
  function vh() { return overlay ? overlay.clientHeight : window.innerHeight; }

  function render() {
    view.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
    if (pct) pct.textContent = Math.round(s * 100) + '%';
    if (btnFit) btnFit.textContent = (Math.abs(s - fitS) < 0.005) ? '1:1' : '适应';
  }

  function reset(mode) {
    fitS = Math.min(1, vw() / (view.naturalWidth || 1), vh() / (view.naturalHeight || 1));
    s = mode === 'fit' ? fitS : 1;
    tx = ty = 0;
    render();
  }

  // 以视口内 (px,py) 为锚点缩放到 ns：锚点下的图像内容保持不动
  function zoomTo(ns, px, py) {
    ns = Math.min(20, Math.max(0.05, ns));
    if (ns === s) return;
    var qx = px - vw() / 2, qy = py - vh() / 2;
    tx = qx - (qx - tx) * (ns / s);
    ty = qy - (qy - ty) * (ns / s);
    s = ns;
    render();
  }

  var src = '';

  function open(url) {
    if (!url || overlay) return;
    src = url;

    overlay.className = 'gridea-viewer';

    view.className = 'gridea-viewer-img';
    view.alt = '';
    view.draggable = false;
    view.onload = function () { reset('fit'); };
    view.onerror = function () { close(); window.open(src, '_blank'); };
    view.src = src;
    if (view.complete && view.naturalWidth) reset('fit');

    var bar = document.createElement('div');
    bar.className = 'gridea-viewer-bar';
    bar.innerHTML =
      '<button type="button" data-act="out" title="缩小" aria-label="缩小">−</button>' +
      '<span class="gridea-viewer-pct">100%</span>' +
      '<button type="button" data-act="in" title="放大" aria-label="放大">+</button>' +
      '<button type="button" data-act="fit" title="原始大小 / 适应窗口" aria-label="原始大小或适应窗口" style="width:auto;padding:0 10px;font-size:13px">1:1</button>' +
      '<button type="button" data-act="save" title="下载原图" aria-label="下载原图">⤓</button>' +
      '<button type="button" data-act="close" title="关闭" aria-label="关闭">✕</button>';
    pct = bar.querySelector('.gridea-viewer-pct');
    btnFit = bar.querySelector('[data-act="fit"]');

    overlay.appendChild(stage);
    overlay.appendChild(bar);
    stage.appendChild(view);
    document.body.appendChild(overlay);

    prevOverflow = document.documentElement.style.overflow;
    document.documentElement.style.overflow = 'hidden';
    document.addEventListener('keydown', onKey);

    bindGestures();
  }

    else if (e.key === '-') zoomTo(s * 0.8, vw() / 2, vh() / 2);
  }

  // ── 手势：单指/鼠标拖动平移，双指捏合缩放 ──
  function bindGestures() {
    var pointers = {};
    var count = 0, moved = 0, pinch0 = 1, pinchS0 = 1, downEl = null;

    overlay.addEventListener('pointerdown', function (e) {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      moved = 0;
      downEl = e.target;
      // 工具栏不进入拖拽/指针捕获：一旦捕获，click 会被重定向到遮罩，
      // 按钮将收不到原生点击（表现为"点按钮即关闭"）。按钮点击必须走原生路径。
      if (e.target.closest && e.target.closest('.gridea-viewer-bar')) return;
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      count++;
      if (overlay.setPointerCapture) { try { overlay.setPointerCapture(e.pointerId); } catch (err) {} }
      if (count === 2) {
        var pts = values();
        pinch0 = dist(pts[0], pts[1]) || 1;
        pinchS0 = s;
      }
      view.classList.add('gridea-viewer-grabbing');
    });

    overlay.addEventListener('pointermove', function (e) {
      var p = pointers[e.pointerId];
      if (!p) return;
      var dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      moved += Math.abs(dx) + Math.abs(dy);
      if (count === 1) {
        tx += dx; ty += dy;
        render();
      } else if (count === 2) {
        var pts = values();
        var ns = pinchS0 * (dist(pts[0], pts[1]) || 1) / pinch0;
        var mx = (pts[0].x + pts[1].x) / 2 - vw() / 2;
        var my = (pts[0].y + pts[1].y) / 2 - vh() / 2;
        var clamped = Math.min(20, Math.max(0.05, ns));
        if (clamped !== s) {
          tx = mx - (mx - tx) * (clamped / s);
          ty = my - (my - ty) * (clamped / s);
          s = clamped;
          render();
        }
      }
    });

    function end(e) {
      if (pointers[e.pointerId]) { delete pointers[e.pointerId]; count--; }
      if (count <= 0) view.classList.remove('gridea-viewer-grabbing');
    }
    overlay.addEventListener('pointerup', end);
    overlay.addEventListener('pointercancel', end);

    function values() {
      var arr = [];
      for (var k in pointers) arr.push(pointers[k]);
      return arr;
    }
    function dist(a, b) {
      var dx = a.x - b.x, dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    overlay.addEventListener('wheel', function (e) {
      e.preventDefault();
      zoomTo(s * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY);
    }, { passive: false });

    view.addEventListener('dblclick', function (e) {
      zoomTo(Math.abs(s - fitS) < 0.005 ? 1 : fitS, e.clientX, e.clientY);
    });

    overlay.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('[data-act]') : null;
      if (btn) {
        var act = btn.getAttribute('data-act');
        if (act === 'in') zoomTo(s * 1.25, vw() / 2, vh() / 2);
        else if (act === 'out') zoomTo(s * 0.8, vw() / 2, vh() / 2);
        else if (act === 'fit') reset(Math.abs(s - fitS) < 0.005 ? 'actual' : 'fit');
        else if (act === 'save') save();
        else if (act === 'close') close();
        return;
      }
      // 工具栏区域（含按钮间隙）不当作遮罩点击
      if (e.target.closest && e.target.closest('.gridea-viewer-bar')) return;
      // 图片上的按下不关闭：指针捕获会把 click 重定向到遮罩，须按"按下元素"判断
      if (downEl && (downEl === view || (downEl.closest && downEl.closest('.gridea-viewer-bar')))) return;
      if (e.target === view) return;
      if (moved > 6) return; // 拖动结束落在遮罩上也不关闭
      close();
    });
  }

  function save() {
    var name = '';
    try { name = decodeURIComponent((src.split(/[?#]/)[0].split('/').pop() || '')) } catch (err) { name = src.split(/[?#]/)[0].split('/').pop() || ''; }
    if (!name) name = 'image';
    fetch(src, { mode: 'cors' }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.blob();
    }).then(function (b) {
      if (!/\.[a-z0-9]{2,5}$/i.test(name)) {
        var ext = (b.type.split('/')[1] || '').replace('jpeg', 'jpg').replace('svg+xml', 'svg');
        if (ext) name += '.' + ext;
      }
      var url = URL.createObjectURL(b);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    }).catch(function () {
      // 跨域且未开 CORS 的图床：download 属性无效，退化为新标签页打开原图
      window.open(src, '_blank');
    });
  }

  function close() {
    if (!overlay) return;
    document.removeEventListener('keydown', onKey);
    document.documentElement.style.overflow = prevOverflow;
    overlay.remove();
    overlay = null;
  }
})();
</script>
